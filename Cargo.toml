[package]
name = "blst-simple-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Simplified BLS signatures over blst"
repository = "https://github.com/efagerho/blst-simple-rs"

[features]
default = ["signing"]
secret-key-export = ["signing"]
signing = []
portable = ["blst/portable"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(blst_simple_dangerous)"] }

[dependencies]
blst = { version = "=0.3.17", default-features = false }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
