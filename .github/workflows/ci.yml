name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.85
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check all features
        run: cargo check --locked --all-features

  checks:
    name: Rust checks (x86-64)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run Clippy with proof bypass
        env:
          RUSTFLAGS: --cfg blst_simple_dangerous
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Lint documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Lint proof-bypass documentation
        env:
          RUSTDOCFLAGS: --cfg blst_simple_dangerous -D warnings
        run: cargo doc --locked --all-features --no-deps

      - name: Test default features
        run: cargo test --locked

      - name: Test without signing
        run: cargo test --locked --no-default-features

      - name: Test all features
        run: cargo test --locked --all-features

      - name: Test proof bypass
        env:
          RUSTFLAGS: --cfg blst_simple_dangerous
        run: cargo test --locked --all-features
